<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">
  <title>AgaNews</title>
</head>



<body>

<div class="Title">
  <div class="entete">
    <img class="logo" src="logo.png" alt="Logo Agashae">
    <h1>AgaNews</h1>
  </div>
  <p>Bientôt mes premiers articles ici.</p>
</div>

<!--Aide de Claude pour cette partie-->
<input type="search" id="recherche" placeholder="Rechercher...">

  <!--
  - Pas de "/" au début : le lien reste relatif au dossier /AgaNews/
    (un "/" repartirait de la racine agashae.github.io → 404).
  - Pas de "index.md" : GitHub le convertit en index.html, et un
    dossier ouvre automatiquement son index.html.
-->
  <a class="carte" href="articles/AgaNewsEnLigne/" data-tags="web github">
  <!-- <span> conteneur en ligne qui permet d'isoler une partie pour lui appliquer du style ou un comportement dynamique-->
  <span class="date">03.10.2026</span>
  <h2>Comment j'ai mis AgaNews en ligne</h2>
  <p>Mon site publié gratuitement avec GitHub Pages</p>
  <!-- partie pour tagger le tout et pour la recherche-->
    <div class="tags">
    <span class="tag">#web</span>
    <span class="tag">#github</span>
  </div>
  <img class="preview" src="articles/AgaNewsEnLigne/github-pages.png" alt="Image GitHub Pages">
</a>






<!--Aide de CLaude pour le JS-->
<!--
Trouve la case de recherche
Quand on tape dedans, prends le mot tapé (en minuscules), pour chaque carte, lis son texte et ses tags
Si le mot est dedans, affiche-la, sinon cache-la
-->
<script>
  const champ = document.getElementById("recherche");

  champ.addEventListener("input", function () {
    const mot = champ.value.toLowerCase();

    document.querySelectorAll(".carte").forEach(function (carte) {
      const texte = carte.textContent.toLowerCase() + carte.dataset.tags;
      carte.style.display = texte.includes(mot) ? "block" : "none";
    });
  });
</script>


</body>

</html>
